<!DOCTYPE html>
<HTml>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500,600,700&display=swap" rel="stylesheet">
<style>

:root {
 
    --bg: #F2F6FB;
    --surface: #FFFFFF;
    --ink: #0B2545;
    --ink-dim: #5C7593;
    --blue: #0057D8;
    --blue-dim: #E4EFFB;
    --line: #DCE6F2;
    --radius: 8px;
}

*{ box-sizing: border-box; }

html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'inter', sans-serif;
    -webkit-font-smoothing: antialiased;    
}

body{
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

.brand{
display: flex;  
align-items: center;
gap: 10px;
margin-bottom: 28px;
}
    
.brand img{
width: 32px;
height: 32px;
object-fit: contain;
border-radius:4px;
}


.card{
width: 100%;
max-width: 400px;
background: var(--surface);
border: 1px solid var(--line);
border-radius: 16px;
padding: 36px 32px;
box-shadow: 0px 4px 8px rgba(11, 37, 69, 0.14);
}

h1{
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
}

.sub{
    line-height: 1.5;
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0 0 32px;
}

form{display: flex; flex-direction:column; gap: 16px;}

.field{display: flex; flex-direction: column; gap: 6px;}

.field label{
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
}

.field input {
background: var(--bg);
border: 1px solid var(--line);
border-radius: var(--radius);
padding: 11px 13px;
font-size: 14px;
color: var(--ink);
outline: none;
width: 100%;
transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.agree{
display: flex;
align-items: flex-start;
gap: 9px;
font-size: 13px;
color: var(--ink-dim);  
line-height: 1.5;
margin-top: 2px;
}

.agree input{margin-top: 3px; accent-color: var(--blue); width: auto; flex-shrink:0;}
.agree a{color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px;}

button.submit{
background: var(--blue);
margin-top: 6px;
background: var(--blue);
color: #ffff;
border: none;
border-radius: var(--radius);
padding: 13px 16px;
font-family: 'inter', sans-serif;
font-weight: 600;
font-size: 14.5px;
cursor: pointer;
transition: background 0.15s ease, transform 0.1s ease;
}

button.submit:hover{background: #0046B0;}
button.submit:active{transform: translateY(1px);}
.switch-line{
text-align: center;
font-size: 13px;
color: var(--ink-dim);
margin-top: 20px;
}
.switch-line a{color: var(--blue); text-decoration: none; font-weight: 500;}
:Focus-visible{outline: 2px solid var(--blue); outline-offset: 2px;}

@media(prefers-reduced-motion: reduce){
    *{transition: none !important;}
}

</style>
</head>

<body>

        <div class="brand">
            <img src="flightacad.jpg" alt="My Logo">
            <span>Flight Academy</span>
       </div>
    
    <div class="card">
        <h1>Log-In</h1>
       
        <form nonvalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <form nonvalidate>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            
            <label class="agree">
                <input type="checkbox" name="terms" required>
                <span>Remember Account?</span>
            
            </label>
        
            <button type="submit" class="submit" onclick="">Log-In</button>
        
        </form>   

    </div>

</body>
</HTml>
