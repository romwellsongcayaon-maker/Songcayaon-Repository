<!DOCTYPE html>
<HTml>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500,600,700&display=swap" rel="stylesheet">
<link rel ="stylesheet" href="Log-in Styles.css">
</head>




<body> 

        <div class="brand">
            <img src="1.jpg" alt="My Logo">
            <span>Spot and Fly</span>
       </div>
    
    <div class="card">
        <h1>Log-In</h1>
       
        <form nonvalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <form nonvalidate>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            
            <label class="agree">
                <input type="checkbox" name="terms">
                <span>Remember Account?</span>
            
            </label>
        
            <button type="submit" class="submit" onclick="">Log-In</button>
        
        </form>   
                  

        <p class="switch-line"> Don't have an Account? <a href="regis.html">Register</a></p>


    </div>

</body>
</HTml>
